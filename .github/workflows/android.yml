name: APK Asuka
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android du runner
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: asuka-debug-signing-v1
      - uses: gradle/actions/setup-gradle@v5
      - name: Modèles locaux officiels (SHA-256)
        run: python3 scripts/models.py
      - name: Vérifier et fabriquer
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: Asuka-APK-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
